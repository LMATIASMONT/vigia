const synth = null; // voz del celular desactivada
const AUDIO = {}; // audios grabados: clave -> "data:audio/mpeg;base64,..."
let voiceOn = false, esVoice = null;
function pickVoice(){
  if(!synth) return;
  const vs = synth.getVoices();
  const pref = ["es-CO","es-419","es-MX","es-US","es-ES"];
  for(const p of pref){ const v = vs.find(v=>v.lang && v.lang.replace("_","-").toLowerCase().startsWith(p.toLowerCase())); if(v){esVoice=v;return;} }
  esVoice = vs.find(v=>v.lang && v.lang.toLowerCase().startsWith("es")) || null;
}
function speak(text){
  if(!synth) return;
  try{ synth.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = esVoice ? esVoice.lang : "es-CO"; if(esVoice) u.voice = esVoice; u.rate = 0.95; synth.speak(u); }catch(e){}
}
function stopSpeak(){ if(synth){ try{synth.cancel();}catch(e){} } }
if(synth){
  pickVoice(); synth.onvoiceschanged = pickVoice;
  const vb = document.getElementById("voiceBtn"); vb.classList.remove("hidden");
  vb.onclick = ()=>{ voiceOn=!voiceOn; vb.setAttribute("aria-pressed",voiceOn); document.getElementById("voiceLbl").textContent = voiceOn?"Voz activada":"Leer en voz alta"; if(voiceOn) speak("Voz activada. Te leeré cada reto."); else stopSpeak(); };
}

/* ---------- Código verificable ---------- */
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function fnv(str){ let h=0x811c9dc5; for(const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }
function dayIndex(d){ return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/86400000); }
function prefix(score){ return (score>=NEED?"A":"N")+Math.round(score/TOTAL*100); }
// Código único: lleva la cédula, la fecha y la hora (minuto) en que terminó, el intento y el resultado.
function makeCode(ced,score,attempt,day,minute,sede,commit){
  let d = BigInt(Number(ced)%17179869184);                 // 34 bits
  d = d*32n + BigInt(score);                               // 5
  d = d*16n + BigInt(Math.min(attempt,15));                // 4
  d = d*2048n + BigInt(day);                               // 11
  d = d*2048n + BigInt(minute);                            // 11
  d = d*16n + BigInt(sede);                                // 4
  d = d*4n + BigInt(commit);                               // 2  -> 71 bits
  const chk = BigInt(fnv(`${SALT}|${d}`) & 0x7FFFF);       // 19 bits
  let v = d*524288n + chk, s = "";
  for(let i=0;i<18;i++){ s = B32[Number(v%32n)] + s; v = v/32n; }
  return prefix(score)+"-"+s.slice(0,6)+"-"+s.slice(6,12)+"-"+s.slice(12);
}
function readCode(code,cedCheck){
  const m = String(code).toUpperCase().replace(/\s/g,"").match(/^([AN])(\d{1,3})-?([0-9A-Z]{6})-?([0-9A-Z]{6})-?([0-9A-Z]{6})$/);
  if(!m) return null;
  const s = (m[3]+m[4]+m[5]).replace(/O/g,"0").replace(/[IL]/g,"1");
  let v=0n; for(const ch of s){ const i=B32.indexOf(ch); if(i<0) return null; v=v*32n+BigInt(i); }
  const chk = v%524288n; let d = v/524288n;
  const okChk = BigInt(fnv(`${SALT}|${d}`) & 0x7FFFF) === chk;
  const commit=Number(d%4n); d/=4n; const sede=Number(d%16n); d/=16n; const minute=Number(d%2048n); d/=2048n;
  const day=Number(d%2048n); d/=2048n; const attempt=Number(d%16n); d/=16n; const score=Number(d%32n); d/=32n; const ced=String(d);
  const date = new Date(EPOCH + day*86400000);
  const hora = `${String(Math.floor(minute/60)).padStart(2,"0")}:${String(minute%60).padStart(2,"0")}`;
  const st=SITES[sede];
  const valid = okChk && !!st && (m[1]+m[2])===prefix(score) && score<=TOTAL && (!cedCheck || String(Number(cedCheck)%17179869184)===ced);
  return {valid,ced,score,attempt,client:st?st.client:"",sede:st?st.sede:"",commit,date,hora};
}

function shuffleQ(q){ const idx=q.o.map((_,i)=>i); for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];} return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}; }

    <p>En cada parada respondes situaciones del día a día, sumas puntos y avanzarás hasta la meta. Al final obtendrás tu certificado.</p>
    <p class="lead">⏱️ Te toma unos 15 minutos. ¿Listo para el reto?</p>
    <button class="btn" id="begin">¡Arrancar el juego!</button>
  </section>
  <p style="text-align:center;margin-top:18px"><button class="linkbtn" id="adm">Acceso Formación: validar registros</button></p>`);
  document.getElementById("begin").onclick=registerForm;
  document.getElementById("adm").onclick=()=>{ location.hash="verificar"; };
}

function registerForm(){
  go(`<section class="card">
    <h2>Tus datos</h2>
    <p class="lead">Con estos datos queda registrada tu reinducción.</p>
        <label for="n1">Nombres y apellidos completos</label><input id="n1" autocomplete="name" placeholder="Ej.: Juan Carlos Rodríguez Pérez" value="${esc(state.name||"")}">
    <label for="c">Número de cédula</label><input id="c" inputmode="numeric" value="${esc(state.id)}">
    <label for="cl">Cliente</label>
    <select id="cl"><option value="">Elige tu cliente</option>${Object.keys(CLIENTES).map(x=>`<option ${state.client===x?"selected":""}>${x}</option>`).join("")}</select>
    <label for="s">Sede</label>
    <select id="s" disabled><option value="">Primero elige tu cliente</option></select>
    <div class="err" id="err" role="alert"></div>
    <div class="consent">
      <strong>Autorización de tratamiento de datos personales</strong>
      <p>En cumplimiento de la Ley 1581 de 2012 y el Decreto 1377 de 2013, autorizo de manera previa, expresa e informada a Transportes Vigía S.A.S. (NIT 800.042.210-2) para recolectar, almacenar, usar y tratar los datos personales que registro en esta actividad (nombres, apellidos, cédula, cliente, sede y resultados), con la finalidad de registrar mi asistencia, evaluar mi reinducción, emitir mi certificado y hacer seguimiento a mi formación.</p>
      <p>Conozco que puedo conocer, actualizar, rectificar y suprimir mis datos, y revocar esta autorización, escribiendo a datospersonales@transportesvigia.com. Puedo consultar la política completa <a href="https://transportesvigia.com/wp-content/uploads/2025/08/PoliticaTratamientodeDatos.pdf" target="_blank" rel="noopener">aquí: Política de Tratamiento de la Información</a>.</p>
      <label class="check"><input type="checkbox" id="ok"> <span>He leído y <b>autorizo</b> el tratamiento de mis datos personales.</span></label>
    </div>
    <button class="btn" id="go" disabled>Arrancar la ruta</button>
    <button class="btn ghost" id="back">Volver</button>
  </section>`);
  document.getElementById("back").onclick=start;
  const okBox=document.getElementById("ok"), goBt=document.getElementById("go");
  okBox.checked=!!state.consent; goBt.disabled=!okBox.checked;
  okBox.onchange=()=>{ goBt.disabled=!okBox.checked; };
  const clSel=document.getElementById("cl"), sSel=document.getElementById("s");
  const fillSites=()=>{ const ss=CLIENTES[clSel.value]||[];
    sSel.innerHTML = ss.length ? `<option value="">Elige tu sede</option>`+ss.map(x=>`<option ${state.site===x&&state.client===clSel.value?"selected":""}>${x}</option>`).join("") : `<option value="">Primero elige tu cliente</option>`;
    sSel.disabled=!ss.length; };
  clSel.onchange=fillSites; fillSites();
  document.getElementById("go").onclick=()=>{
    const n=document.getElementById("n1").value.trim().replace(/\s+/g," "), c=document.getElementById("c").value.replace(/\D/g,""), s=document.getElementById("s").value;
    const err=m=>document.getElementById("err").textContent=m;
    if(n.split(" ").filter(w=>w.length>1).length<3) return err("Escribe tus nombres y apellidos completos, como aparecen en tu cédula.");
    state.consent=new Date().toLocaleString("es-CO");
    if(c.length<6) return err("Escribe tu número de cédula, solo números.");
    const cl=document.getElementById("cl").value;
    if(!document.getElementById("ok").checked) return err("Para continuar debes autorizar el tratamiento de tus datos personales.");
    if(!cl) return err("Elige tu cliente.");
    if(!s) return err("Elige tu sede.");
    Object.assign(state,{name:n,id:c,client:cl,site:s,stop:0,q:0,score:0,answered:0,commit:null,plan:null,misses:[]});
    buildDeck(); stopIntro();
  };
}

function stopIntro(){
  progress();
  const s=STOPS[state.stop];
  go(`<section class="card">
    <span class="pill">Parada ${state.stop+1} de ${STOPS.length}</span>
    <h2>${s.title}</h2>
    <p class="lead">${s.hook}</p>
    ${listenBtn("lsn")}
    <button class="btn" id="next">Empezar los retos</button>
  </section>`);
  const l=document.getElementById("lsn"); if(l) l.onclick=()=>speak(s.title+". "+s.hook);
  if(voiceOn) speak(s.title+". "+s.hook);
  document.getElementById("next").onclick=()=>{state.q=0; if(s.present==="projects") projectView(0); else if(s.present==="benefits") benefitView(0); else if(s.present==="values") valuesView(); else question();};
}

function projectView(i){
  const p=PROJECTS[i], last=i===PROJECTS.length-1;
  go(`<section class="card">
    <span class="pill">Proyecto ${i+1} de ${PROJECTS.length}</span>
    <div class="logo-tile" style="background:${p.tile}"><img src="${LOGOS[p.key]}" alt="Logo de ${p.name}"></div>
    <h2>${p.name}</h2>
    <p class="slogan">${p.slogan}</p>
    <h3>Para qué existe</h3>
    <p>${p.obj}</p>
    <div class="situation">En tu día a día: ${p.you}</div>
    <div class="dots" aria-hidden="true">${PROJECTS.map((_,k)=>`<span class="${k===i?"on":""}"></span>`).join("")}</div>
    <button class="btn" id="next">${last?"Ver si los reconoces":"Siguiente proyecto"}</button>
    ${i>0?`<button class="btn ghost" id="prev">Anterior</button>`:""}
  </section>`);
  document.getElementById("next").onclick=()=>{ if(last) anchorView(); else projectView(i+1); };
  const pv=document.getElementById("prev"); if(pv) pv.onclick=()=>projectView(i-1);
}

function valuesView(){
  go(`<section class="card">
    <span class="pill">Nuestros valores</span>
    <h2>Lo que nos identifica</h2>
    ${VALUES.map(v=>`<div class="value"><h3>${v.name}</h3><p>${v.text}</p></div>`).join("")}
    <button class="btn" id="next">Ver qué dicen nuestros líderes</button>
  </section>`);
  document.getElementById("next").onclick=()=>question();
}

function benefitView(i){
  const b=BENEFITS[i], last=i===BENEFITS.length-1;
  go(`<section class="card">
    <span class="pill">Tus beneficios · ${i+1} de ${BENEFITS.length}</span>
    <h2>${b.title}</h2>
    <ul class="takeaways">${b.items.map(t=>`<li>${t}</li>`).join("")}</ul>
    <div class="situation" style="margin-top:14px">${b.note}</div>
    <div class="dots" aria-hidden="true">${BENEFITS.map((_,k)=>`<span class="${k===i?"on":""}"></span>`).join("")}</div>
    <button class="btn" id="next">${last?"Ver qué tanto recuerdas":"Siguiente"}</button>
    ${i>0?`<button class="btn ghost" id="prev">Anterior</button>`:""}
  </section>`);
  document.getElementById("next").onclick=()=>{ if(last) question(); else benefitView(i+1); };
  const pv=document.getElementById("prev"); if(pv) pv.onclick=()=>benefitView(i-1);
}

function qSpeech(q){ return (q.quote? `Escucha a ${q.who}. ${q.quote}. ` : "") + q.q + " Opciones: " + q.o.map((o,i)=>`${i+1}. ${o}.`).join(" "); }

function question(){
  progress();
  const s=STOPS[state.stop], q=curQ();
  go(`<section class="card">
    <div class="qhead"><span class="qcount">${state.retry?`Repaso · Reto ${state.ri+1} de ${state.retry.length}`:`Parada ${state.stop+1} · Reto ${state.q+1} de ${s.qs.length}`}</span>${listenBtn("lsn")}</div>
    ${q.quote?`<div class="quote">“${q.quote}”<cite>${q.who}</cite>${q.audio&&AUDIO[q.audio]?`<button class="listen" id="aud" style="margin-top:10px">${SPK}Escuchar su voz</button>`:""}</div>`:""}
    <div class="situation">${q.q}</div>
    <div class="${q.type==="logo"?"opts logo-opts":"opts"}" role="group" aria-label="Opciones">${q.o.map((o,i)=>q.type==="logo"
      ?`<button class="opt logo-opt" data-i="${i}" aria-label="${optLabel(q,o)}" style="--tile:${PROJECTS.find(p=>p.key===o).tile}"><img src="${LOGOS[o]}" alt=""></button>`
      :`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>
    <div id="fb" aria-live="polite"></div>
  </section>`);
  const l=document.getElementById("lsn"); if(l) l.onclick=()=>speak(qSpeech(q));
  const ab=document.getElementById("aud"); if(ab){ const au=new Audio(AUDIO[q.audio]); ab.onclick=()=>{au.currentTime=0; au.play().catch(()=>{});}; }
  if(voiceOn) speak(qSpeech(q));
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}

function curQ(){ return state.retry ? state.retry[state.ri] : deck[state.stop][state.q]; }
function optLabel(q,o){ return q.type==="logo" ? PROJECTS.find(p=>p.key===o).name : o; }

function answer(i){
  const q=curQ(), ok=i===q.a;
  if(state.retry){
    if(ok) state.score++; else state.misses.push({ref:q,q:q.q,mine:optLabel(q,q.o[i]),right:optLabel(q,q.o[q.a]),e:q.e});
  } else {
    if(ok) state.score++; else state.misses.push({ref:q,q:q.q,mine:optLabel(q,q.o[i]),right:optLabel(q,q.o[q.a]),e:q.e});
    state.answered++;
  }
  app.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.i;b.disabled=true;if(k===q.a)b.classList.add("right");else if(k===i)b.classList.add("wrong");});
  const last=state.retry ? state.ri===state.retry.length-1 : state.q===STOPS[state.stop].qs.length-1;
  document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">
      ${ok?`<strong>¡Correcta!</strong>`:`<strong>Incorrecta</strong><p class="fbline">Tú elegiste: ${optLabel(q,q.o[i])}</p><p class="fbline">La correcta es: <b>${optLabel(q,q.o[q.a])}</b></p>`}
      ${q.proj?`<img class="mini-logo" style="background:${PROJECTS.find(p=>p.key===q.proj).tile}" src="${LOGOS[q.proj]}" alt="">`:""}
      <p class="fbline">${q.e}</p></div>
    <button class="btn" id="next">${last?(state.retry?"Ver mi nuevo resultado":"Ver lo que te llevas"):"Siguiente reto"}</button>`;
  if(voiceOn) speak((ok?"Correcta. ":"Incorrecta. La respuesta es: "+optLabel(q,q.o[q.a])+". ")+q.e);
  progress();
  const fbEl=document.getElementById("fb"); const nx=document.getElementById("next");
  fbEl.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
  nx.disabled=true; setTimeout(()=>{nx.disabled=false;},1200);
  nx.onclick=()=>{
    if(state.retry){ if(!last){state.ri++;question();} else { state.retry=null; checkScore(); } }
    else if(!last){state.q++;question();} else recap();
  };
}

function recap(){
  const s=STOPS[state.stop], end=state.stop===STOPS.length-1;
  go(`<section class="card">
    <span class="pill">Fin de la parada ${state.stop+1}</span>
    <h2>Lo que te llevas</h2>
    ${listenBtn("lsn")}
    <ul class="takeaways">${s.take.map(t=>`<li>${t}</li>`).join("")}</ul>
    <button class="btn" id="next">${s.plan?"Armar mi plan de beneficios":end?"Ver mi resultado":"Seguir a la siguiente parada"}</button>
  </section>`);
  const txt="Lo que te llevas. "+s.take.join(" ");
  const l=document.getElementById("lsn"); if(l) l.onclick=()=>speak(txt);
  if(voiceOn) speak(txt);
  document.getElementById("next").onclick=()=>{ if(s.plan) planForm(); else if(end) checkScore(); else {state.stop++;stopIntro();} };
}

function checkScore(){
  if(state.score>=NEED){ state.commit===null ? commitScreen() : result(); return; }
  const pct=Math.round(state.score/TOTAL*100), faltan=NEED-state.score;
  go(`<section class="card">
    <h2>¡Ups! Te faltó poco</h2>
    <div class="score">${pct}%</div>
    <p class="lead">Llevas ${state.score} de ${TOTAL} retos correctos. Con ese porcentaje no puedes pasar al último paso: necesitas ${NEED} para aprobar, te faltan ${faltan}.</p>
    <p>Puedes volver a responder todas las preguntas. Ya viste la respuesta correcta de cada una, así que es tu oportunidad de demostrar lo que aprendiste.</p>
    <button class="btn" id="retry">Reintentar todas las preguntas</button>
    <button class="btn ghost" id="send">Enviarlo así</button>
  </section>`);
  document.getElementById("retry").onclick=startRetry;
  document.getElementById("send").onclick=()=>{ state.commit===null ? commitScreen() : result(); };
}
function startRetry(){
  state.attempt++;
  state.retry=STOPS.flatMap(s=>s.qs).map(shuffleQ);
  state.score=0; state.misses=[];
  state.ri=0;
  question();
}

/* ---------- Mi plan de beneficios ---------- */
function planForm(){
  const thisYear=new Date().getFullYear();
  go(`<section class="card">
    <span class="pill">Tu plan</span>
    <h2>Arma tu plan de beneficios</h2>
    <p class="lead">Tres datos y te decimos qué pedir y cuándo, para que no se te pase ninguno.</p>
    <label>Fecha de tu cumpleaños</label>
    <div class="row2">
      <select id="bd"><option value="">Día</option>${Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join("")}</select>
      <select id="bm"><option value="">Mes</option>${MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join("")}</select>
    </div>
    <label>¿Cuándo entraste a Vigía?</label>
    <div class="row2">
      <select id="im"><option value="">Mes</option>${MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join("")}</select>
      <select id="iy"><option value="">Año</option>${Array.from({length:45},(_,i)=>`<option>${thisYear-i}</option>`).join("")}</select>
    </div>
    <label for="gr">¿Tú o alguno de tus hijos se gradúa en los próximos meses?</label>
    <select id="gr"><option value="no">No</option><option value="si">Sí</option></select>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="go">Ver mi plan</button>
  </section>`);
  document.getElementById("go").onclick=()=>{
    const bd=+document.getElementById("bd").value, bm=document.getElementById("bm").value, im=document.getElementById("im").value, iy=document.getElementById("iy").value;
    if(!bd||bm==="") return document.getElementById("err").textContent="Elige el día y el mes de tu cumpleaños.";
    if(im===""||!iy) return document.getElementById("err").textContent="Elige el mes y el año en que entraste.";
    state.plan=buildPlan(bd,+bm,+im,+iy,document.getElementById("gr").value==="si");
    planView();
  };
}
function fmt(d){ return `${d.getDate()} de ${MONTHS[d.getMonth()]} de ${d.getFullYear()}`; }
function buildPlan(bd,bm,im,iy,grad){
  const today=new Date(); today.setHours(0,0,0,0);
  let bday=new Date(today.getFullYear(),bm,Math.min(bd,new Date(today.getFullYear(),bm+1,0).getDate()));
  if(bday<today) bday=new Date(today.getFullYear()+1,bm,Math.min(bd,new Date(today.getFullYear()+1,bm+1,0).getDate()));
  let ask=new Date(bday); ask.setMonth(ask.getMonth()-1);
  const items=[];
  const askTxt = ask<today ? `Ya estás dentro del mes previo: habla hoy mismo con tu jefe directo para coordinar tu día del ${fmt(bday)}.` : `Antes del ${fmt(ask)}, solicita a tu jefe directo tu día compensatorio por cumpleaños (${fmt(bday)}). Según la operación, puede que tu día no caiga justo en tu fecha.`;
  items.push(askTxt);
  const marks=[3,5,10,15,20,25,30,35,40];
  const start=new Date(iy,im,1);
  const next=marks.find(n=>new Date(iy+n,im,1)>=new Date(today.getFullYear(),today.getMonth(),1));
  if(next) items.push(`En ${MONTHS[im]} de ${iy+next} cumples ${next} años en Vigía: recibes un día hábil de permiso remunerado, bonificación y pieza de reconocimiento. Coordina ese día con tu jefe directo.`);
  if(grad) items.push("Para la graduación: avisa a tu jefe directo y a Gente y Cultura con un mes de anticipación de la ceremonia para programar tu día compensatorio. Si el graduado eres tú, también recibes una pieza de reconocimiento.");
  items.push("Tu póliza exequial ya está cubierta por Vigía y protege a tu padre, madre, cónyuge e hijos: cuéntale a tu familia que existe.");
  items.push("Si tienes una inquietud, usa Vigía te escucha.");
  return {items, short:`Pedir día de cumpleaños antes del ${fmt(ask<today?today:ask)}`};
}
function planView(){
  go(`<section class="card">
    <span class="pill">Tu plan</span>
    <h2>Tu plan de beneficios</h2>
    ${listenBtn("lsn")}
    <ol class="plan">${state.plan.items.map(t=>`<li>${t}</li>`).join("")}</ol>
    <p class="small">Toma captura de esta pantalla para tenerla a mano.</p>
    <button class="btn" id="next">Seguir a la última parada</button>
  </section>`);
  const txt="Tu plan de beneficios. "+state.plan.items.join(" ");
  const l=document.getElementById("lsn"); if(l) l.onclick=()=>speak(txt);
  if(voiceOn) speak(txt);
  document.getElementById("next").onclick=()=>{state.stop++;stopIntro();};
}

/* ---------- Compromiso y resultado ---------- */
function commitScreen(){
  go(`<section class="card">
    <h2>Tu compromiso</h2>
    <p class="lead">Elige una cosa que vas a hacer en los próximos 30 días. Tu coordinador te preguntará cómo te fue.</p>
    <div class="opts">${COMMITS.map((c,i)=>`<button class="opt" data-i="${i}">${c}</button>`).join("")}</div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="next">Terminar la ruta</button>
  </section>`);
  if(voiceOn) speak("Elige tu compromiso para los próximos treinta días. "+COMMITS.map((c,i)=>`${i+1}. ${c}.`).join(" "));
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");state.commit=+b.dataset.i;});
  document.getElementById("next").onclick=()=>{ if(state.commit===null){document.getElementById("err").textContent="Elige tu compromiso para terminar.";return;} result(); };
}

const dipImgs = {};
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function dipAssets(){
  for(const k of Object.keys(DIP)){ if(!dipImgs[k]) dipImgs[k]=await loadImg(DIP[k]); }
  try{ await Promise.all(["500","600","700","800"].map(w=>document.fonts.load(`${w} 40px Montserrat`))); }catch(e){}
}
function titleCase(s){ return String(s).toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()); }
function longDate(d,utc){ return d.toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric",timeZone:utc?"UTC":undefined}); }
async function drawDiploma(o){

  const font=(w,s)=>{x.font=`${w} ${s}px ${F}`;};
  const top=(t,w,s,color,y,maxW)=>{ font(w,s); if(maxW){ while(x.measureText(t).width>maxW && s>40){ s-=2; font(w,s);} } x.fillStyle=color; x.textAlign="center"; x.textBaseline="top"; x.fillText(t,W/2,y+s*0.11); };
  const mixed=(parts,y,align,left)=>{ // parts: [text,weight,size,color]
    let total=0; parts.forEach(p=>{font(p[1],p[2]); total+=x.measureText(p[0]).width;});
    let cx = align==="left" ? left : (W-total)/2; x.textAlign="left"; x.textBaseline="alphabetic";
    const base = y + Math.max(...parts.map(p=>p[2]))*0.95;
    parts.forEach(p=>{ font(p[1],p[2]); x.fillStyle=p[3]; x.fillText(p[0],cx,base); cx+=x.measureText(p[0]).width; });
  };
  x.fillStyle="#FFFFFF"; x.fillRect(0,0,W,H);

let dlPromise=null;
function getDownloads(){
  if(!dlPromise) dlPromise=(async()=>{ try{ return (window.claude && typeof window.claude.use==="function") ? await window.claude.use("downloads") : null; }catch(e){ return null; } })();

function diplomaPdf(canvas,portrait){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation:portrait?"portrait":"landscape",unit:"mm",format:"a4",compress:true});
  pdf.setProperties({title:portrait?"Lo esencial de tu reinducción · Vigía":"Certificado de reinducción · Vigía",author:"Transportes Vigía · Gente & Cultura"});
  (Array.isArray(canvas)?canvas:[canvas]).forEach((cv,i)=>{ if(i) pdf.addPage("a4",portrait?"portrait":"landscape"); pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,portrait?210:297,portrait?297:210); });
  return pdf.output("blob");
}
async function saveDiploma(canvas,filename,portrait){
  const dl=await getDownloads(); if(!dl) return "none";
  const blob=diplomaPdf(canvas,portrait);
  try{ await dl.save({filename,data:blob}); return "saved"; }
  catch(e){ return e && e.code==="declined" ? "declined" : "none"; }
}

function wrapLines(x,text,maxW){
  const words=String(text).split(/\s+/), lines=[]; let line="";

  if(line) lines.push(line); return lines;
}

    const rows=[], seen=new Set();
    const add=(name,cedMsg,code,commitMsg)=>{
      const key=code.toUpperCase().replace(/[^0-9A-Z]/g,""); if(seen.has(key)) return; seen.add(key);
      const r=readCode(code,cedMsg); rows.push({name,ced:r?r.ced:cedMsg,code,r,commitTxt:r&&r.valid?COMMITS[r.commit]:commitMsg});
    };
    if(/Reinducci[oó]n (?:Soy Vig[ií]a|Gente (?:&|y) Cultura)/i.test(raw)){
      for(const b of raw.split(/Reinducci[oó]n (?:Soy Vig[ií]a|Gente (?:&|y) Cultura)/i).map(x=>x.trim()).filter(Boolean)){
        const g=k=>{const m=b.match(new RegExp(k+"\\s*:\\s*(.+)","i"));return m?m[1].trim():"";};
        const cm=b.match(CODE); if(!cm) continue;
        add(g("Nombre"),g("C[eé]dula").replace(/\D/g,""),cm[1],g("Compromiso"));
      }
    } else {
      for(const line of raw.split(/\r?\n/)){
        const cells=line.split(/\t|;|,/).map(c=>c.trim());
        const codeCell=cells.find(c=>CODE.test(c)); if(!codeCell) continue;
        const ced=(cells.find(c=>/^\d[\d.\s]{5,14}$/.test(c))||"").replace(/\D/g,"");
        const name=cells.find(c=>/[a-záéíóúñ]{2,}\s+[a-záéíóúñ]{2,}/i.test(c)&&!CODE.test(c)&&!/@/.test(c))||"";
        add(name,ced,codeCell.match(CODE)[1],"");
      }
    }
    if(!rows.length){ document.getElementById("out").innerHTML=`<p class="err" style="margin-top:14px">No encontré registros. Revisa que cada mensaje o fila tenga el código.</p>`; return; }
    // último intento por cédula
    const best={}; rows.forEach(x=>{ if(x.r&&x.r.valid){ const p=best[x.ced]; if(!p||x.r.attempt>p.r.attempt) best[x.ced]=x; } });
    const valid=rows.filter(x=>x.r&&x.r.valid), uniq=Object.values(best), aprob=uniq.filter(x=>x.r.score>=NEED);
    const tsv=["Nombre\tCédula\tCliente\tSede\tPuntaje\tEstado\tIntento\tFecha\tHora\tCompromiso\tCódigo\tValidez"];
    const trs=rows.map(x=>{
      const ok=x.r&&x.r.valid;
      const sc=ok?`${Math.round(x.r.score/TOTAL*100)}% (${x.r.score}/${TOTAL})`:"—";
      const est=ok?(x.r.score>=NEED?"Aprobado":"No aprobado"):"—";
      const f=ok?x.r.date.toLocaleDateString("es-CO",{timeZone:"UTC"}):"—";
      tsv.push([x.name,x.ced,ok?x.r.client:"",ok?x.r.sede:"",sc,est,ok?x.r.attempt:"",f,ok?x.r.hora:"",x.commitTxt,x.code,ok?"Válido":"No válido"].join("\t"));
      return `<tr><td>${esc(x.name)}</td><td>${x.ced}</td><td>${ok?x.r.client:"—"}</td><td>${ok?x.r.sede:"—"}</td><td>${sc}</td><td class="${ok&&x.r.score>=NEED?"ok-t":"bad-t"}">${est}</td><td>${ok?x.r.attempt:"—"}</td><td>${f}</td><td>${ok?x.r.hora:"—"}</td><td>${esc(x.code)}</td><td class="${ok?"ok-t":"bad-t"}">${ok?"Válido":"No válido"}</td><td>${ok&&x.r.score>=NEED?`<button class="listen dipbtn" data-k="${rows.indexOf(x)}">Descargar PDF</button>`:"—"}</td></tr>`;
    }).join("");
    document.getElementById("out").innerHTML=`
      <div class="stats"><span>${rows.length} registros leídos</span><span>${valid.length} válidos</span><span>${uniq.length} conductores</span><span>${aprob.length} aprobados</span></div>
      <div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Cédula</th><th>Cliente</th><th>Sede</th><th>Puntaje</th><th>Estado</th><th>Intento</th><th>Fecha</th><th>Hora</th><th>Código</th><th>Validez</th><th>Certificado</th></tr></thead><tbody>${trs}</tbody></table></div>
      <button class="btn ghost" id="cp">Copiar tabla para Excel</button>
      <textarea id="tsv" class="hidden" readonly>${esc(tsv.join("\n"))}</textarea>
      <p class="small" style="margin-top:10px">Si el mensaje no trae el nombre (por ejemplo, una fila de Forms sin nombre), el certificado sale como “Colaborador Vigía”. “No válido” significa que el código fue cambiado a mano, que no corresponde a la cédula del mensaje o que está incompleto. Los códigos repetidos se cuentan una sola vez.</p>`;
    app.querySelectorAll(".dipbtn").forEach(bt=>bt.onclick=async()=>{
      const x=rows[+bt.dataset.k], r=x.r, pct=Math.round(r.score/TOTAL*100);
      const name=x.name||"Colaborador Vigía";
      bt.textContent="Generando…";
      const code=x.code.toUpperCase().replace(/\s/g,"");
      const cv=await drawDiploma({name,ced:r.ced,client:r.client,sede:r.sede,pct,code,dateText:longDate(r.date,true)});
      const res=await saveDiploma(cv,dipFilename(name,r.ced));
      bt.textContent="Descargar PDF";
      if(res==="none"){
        const m=document.createElement("div"); m.className="modal";
        m.innerHTML=`<div class="modal-box"><p class="small">Haz clic derecho sobre la imagen y elige “Guardar imagen como…”.</p><img class="dip-img" alt="Certificado" src="${cv.toDataURL("image/png")}"><button class="btn ghost">Cerrar</button></div>`;
        m.querySelector("button").onclick=()=>m.remove(); document.body.appendChild(m);
      }
    });
    document.getElementById("cp").onclick=async()=>{
      const t=document.getElementById("tsv"); let done=false;
      try{ await navigator.clipboard.writeText(t.value); done=true; }catch(e){}
      if(!done){ t.classList.remove("hidden"); t.select(); try{done=document.execCommand("copy");}catch(e){} }
      document.getElementById("cp").textContent=done?"Tabla copiada: pégala en Excel":"Selecciona el texto y cópialo";
    };
  };
}

function route(){ if(location.hash==="#verificar") verifier(); else { document.getElementById("road").classList.remove("hidden"); document.getElementById("wrap").classList.remove("wide"); start(); } }
window.addEventListener("hashchange",route);
route();
</script>
